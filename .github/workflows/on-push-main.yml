# yaml-language-server: $schema=./node_modules/@sargonpiraev/eslint-config/build/schemas/project__workflow-on-push-main.json
name: on-push-main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: on-push-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    uses: sargonpiraev/shared/.github/workflows/on-push-main.yml@main
    secrets: inherit

  playwright-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - id: image
        run: |
          set -euo pipefail
          IMAGE=$(node -e '
            const lock = require("./package-lock.json");
            const key = Object.keys(lock.packages).find((k) =>
              k.endsWith("node_modules/@playwright/test"),
            );
            if (!key) {
              throw new Error("missing @playwright/test in package-lock.json");
            }
            process.stdout.write(
              "mcr.microsoft.com/playwright:v" +
                lock.packages[key].version +
                "-jammy",
            );
          ')
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

  test-webapp:
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v6

      - uses: sargonpiraev/shared/.github/actions/setup-node-npm-ci@main

      - name: Build seokit
        run: npm run build
        working-directory: packages/seokit

      - name: Webapp Playwright spec
        run: npm run test:spec
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

      - name: Webapp visual
        run: npm run test:visual
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

      - name: Webapp cwv
        run: npm run test:cwv
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

  publish-npm:
    needs: [base, test-webapp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: sargonpiraev/shared/.github/actions/setup-node-npm-ci@main

      - run: npm run build
        working-directory: packages/seokit

      - name: Sync seokit release tag with npm
        working-directory: packages/seokit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="seokit-v${PKG_VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 0
          fi
          NPM_VERSION=$(npm view @sargonpiraev/seokit version 2>/dev/null || true)
          if [ -z "$NPM_VERSION" ] || [ "$NPM_VERSION" != "$PKG_VERSION" ]; then
            echo "Skip tag sync: npm=$NPM_VERSION package.json=$PKG_VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - run: npx semantic-release
        working-directory: packages/seokit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docs:
    needs: [base, test-webapp]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: sargonpiraev/shared/.github/actions/setup-node-npm-ci@main

      - name: Build static Fumadocs site
        working-directory: apps/docapp
        env:
          DOCS_BASE_PATH: /seokit
        run: npm run build

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p _pages
          cp -r apps/docapp/out/* _pages/
          touch _pages/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - uses: actions/deploy-pages@v4
        id: deployment
